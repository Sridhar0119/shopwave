---
- name: Add Docker GPG key
  apt_key: url=https://download.docker.com/linux/ubuntu/gpg state=present
- name: Add Docker repo
  apt_repository: repo="deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
- name: Install Docker
  apt: name=[docker-ce,docker-ce-cli,containerd.io,docker-compose-plugin] state=present update_cache=yes
- name: Start Docker
  systemd: name=docker enabled=yes state=started
- name: Add ubuntu to docker group
  user: name=ubuntu groups=docker append=yes
